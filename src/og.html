<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root { --bg:#F8FAFC; --blue:#2563EB; --violet:#7C3AED; --lav-soft:#EDE9FE; --blue-soft:#DBEAFE; --ink:#0F172A; --muted:#526077; --line:#E2E8F0; --grad:linear-gradient(120deg,#2563EB,#7C3AED); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: var(--bg); font-family: "Inter", system-ui, sans-serif; color: var(--ink);
    background-image: radial-gradient(520px 520px at 0% 0%, rgba(37,99,235,.18), transparent 70%), radial-gradient(520px 520px at 100% 0%, rgba(139,92,246,.2), transparent 70%); }
  .dots { position: absolute; inset: 0; background: radial-gradient(circle, rgba(100,116,139,.3) 1.2px, transparent 1.6px) 0 0 / 28px 28px; -webkit-mask-image: linear-gradient(to bottom, #000, transparent 80%); mask-image: linear-gradient(to bottom, #000, transparent 80%); }
  .logo { position: absolute; left: 72px; top: 60px; font: 700 40px/1 "Space Grotesk", sans-serif; letter-spacing: -.04em; }
  .logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eyebrow { position: absolute; left: 72px; top: 160px; display: flex; align-items: center; gap: 14px; font: 600 20px/1 "Space Grotesk", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6D28D9; }
  .eyebrow i { width: 40px; height: 5px; border-radius: 5px; background: var(--grad); }
  h1 { position: absolute; left: 72px; top: 205px; margin: 0; font: 700 54px/1.06 "Space Grotesk", sans-serif; letter-spacing: -.035em; }
  h1 span { display: block; }
  h1 .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 6px; }
  .url { position: absolute; left: 72px; bottom: 56px; font: 600 28px/1 "Space Grotesk", sans-serif; color: var(--muted); }
  svg { position: absolute; right: 56px; top: 120px; width: 340px; height: 204px; }
  svg text { font: 600 13px "Space Grotesk", sans-serif; }
</style>
</head>
<body>
<div class="dots"></div>
<div class="logo">Nevin Vu<span>.</span></div>
<div class="eyebrow"><i></i>Senior Solution Architect · Melbourne</div>
<h1><span>Designing systems.</span><span>Building ideas.</span><span class="g">Making technology work.</span></h1>
<div class="url">n3evin.com</div>
<svg viewBox="0 12 400 216" aria-hidden="true">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
  <g fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 5">
    <path d="M136 120 C146 120 150 120 160 120"/>
    <path d="M280 120 C290 120 290 46 300 46"/><path d="M280 120 H300"/><path d="M280 120 C290 120 290 194 300 194"/>
  </g>
  <rect x="16" y="96" width="120" height="48" rx="14" fill="#fff" stroke="#E2E8F0"/>
  <text x="76" y="120" text-anchor="middle" dominant-baseline="central" fill="#0F172A">Business need</text>
  <rect x="160" y="88" width="120" height="64" rx="18" fill="url(#g)"/>
  <text x="220" y="120" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700">Solution design</text>
  <rect x="300" y="28" width="88" height="36" rx="18" fill="#DBEAFE"/><text x="344" y="46" text-anchor="middle" dominant-baseline="central" fill="#1D4ED8">APIs</text>
  <rect x="300" y="102" width="88" height="36" rx="18" fill="#EDE9FE"/><text x="344" y="120" text-anchor="middle" dominant-baseline="central" fill="#6D28D9">Apps</text>
  <rect x="300" y="176" width="88" height="36" rx="18" fill="#DBEAFE"/><text x="344" y="194" text-anchor="middle" dominant-baseline="central" fill="#1D4ED8">Hardware</text>
</svg>
</body>
</html>
